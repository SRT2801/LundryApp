<ion-header>
  <ion-toolbar>
    <ion-title>Iniciar sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    <h1>Bienvenido</h1>
    <p>Inicia sesión para continuar</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <app-custom-input
        label="Correo electrónico"
        type="email"
        placeholder="correo@ejemplo.com"
        [formControl]="emailControl"
        [isInvalid]="emailControl.invalid && emailControl.touched"
        [errorMessage]="emailControl.hasError('required') ? 'El correo es requerido' :
                        emailControl.hasError('email') ? 'Ingresa un correo electrónico válido' : ''"
        autocomplete="email"
        [required]="true">
      </app-custom-input>

      <app-custom-input
        label="Contraseña"
        type="password"
        placeholder="Ingresa tu contraseña"
        [formControl]="passwordControl"
        [isInvalid]="passwordControl.invalid && passwordControl.touched"
        [errorMessage]="passwordControl.hasError('required') ? 'La contraseña es requerida' :
                        passwordControl.hasError('minlength') ? 'La contraseña debe tener al menos 6 caracteres' : ''"
        autocomplete="current-password"
        [required]="true">
      </app-custom-input>

      <div class="error-container" *ngIf="submitError">
        <ion-text color="danger">{{ submitError }}</ion-text>
      </div>

      <div class="button-container">
        <app-custom-button
          text="Iniciar sesión"
          type="submit"
          expand="block"
          [loading]="isLoading"
          [disabled]="loginForm.invalid">
        </app-custom-button>

        <p class="register-link">
          ¿No tienes una cuenta?
          <a (click)="navigateToRegister()">Regístrate aquí</a>
        </p>
      </div>
    </form>
  </div>
</ion-content>
