<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Registro</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="register-container">
    <h1>Crear cuenta</h1>
    <p>Completa el formulario para registrarte</p>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <app-custom-input
        label="Nombre"
        type="text"
        placeholder="Ingresa tu nombre"
        [formControl]="nameControl"
        [isInvalid]="nameControl.invalid && nameControl.touched"
        [errorMessage]="nameControl.hasError('required') ? 'El nombre es requerido' : ''"
        autocomplete="name"
        [required]="true">
      </app-custom-input>

      <app-custom-input
        label="Correo electrónico"
        type="email"
        placeholder="correo@ejemplo.com"
        [formControl]="emailControl"
        [isInvalid]="emailControl.invalid && emailControl.touched"
        [errorMessage]="emailControl.hasError('required') ? 'El correo es requerido' :
                        emailControl.hasError('email') ? 'Ingresa un correo electrónico válido' : ''"
        autocomplete="email"
        [required]="true">
      </app-custom-input>

      <app-custom-input
        label="Contraseña"
        type="password"
        placeholder="Crea tu contraseña"
        [formControl]="passwordControl"
        [isInvalid]="passwordControl.invalid && passwordControl.touched"
        [errorMessage]="passwordControl.hasError('required') ? 'La contraseña es requerida' :
                        passwordControl.hasError('minlength') ? 'La contraseña debe tener al menos 6 caracteres' : ''"
        autocomplete="new-password"
        [required]="true">
      </app-custom-input>

      <div class="error-container" *ngIf="submitError">
        <ion-text color="danger">{{ submitError }}</ion-text>
      </div>

      <div class="button-container">
        <app-custom-button
          text="Crear cuenta"
          type="submit"
          expand="block"
          [loading]="isLoading"
          [disabled]="registerForm.invalid">
        </app-custom-button>

        <p class="login-link">
          ¿Ya tienes una cuenta?
          <a (click)="navigateToLogin()">Inicia sesión aquí</a>
        </p>
      </div>
    </form>
  </div>
</ion-content>
